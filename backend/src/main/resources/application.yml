server:
  port: 7070

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.example.com   # SMTP сервер
    port: 587                # порт (обычно 587 для TLS)
    username: your_email@example.com
    password: your_password
    protocol: smtp
    tls: true
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jpa:
    hibernate:
      ddl-auto: update   # update / create-drop / validate / none
    show-sql: true       # логировать SQL-запросы в консоль
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  tokens:
    access-expiration: 300
    refresh-expiration: 2592000

  rsa:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}

logging:
  level:
    org.springframework.security: DEBUG

