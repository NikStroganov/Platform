name: deploy staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  backend-build:
    name: Build and Deploy Spring Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Dockerhub Login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile.staging
          push: true
          tags: srkinj/platform-backend:staging

      - name: Export OpenAPI from backend build
        run: |
          docker buildx build --file backend/Dockerfile.staging --target openapi \
            --output type=local,dest=/tmp/platform-openapi ./backend
          mkdir -p docs
          cp /tmp/platform-openapi/openapi.json docs/openapi.json

      - name: Upload generated OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi
          path: docs/openapi.json
          if-no-files-found: error

      - name: Print image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  update-openapi:
    name: Commit generated OpenAPI
    needs: backend-build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout built revision
        uses: actions/checkout@v3
        with:
          ref: ${{ github.sha }}

      - name: Download generated OpenAPI
        uses: actions/download-artifact@v4
        with:
          name: backend-openapi
          path: docs

      - name: Commit updated OpenAPI
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/openapi.json; then
            echo "OpenAPI is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/openapi.json
          git commit -m "docs: regenerate backend OpenAPI [skip ci]"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Dockerhub Login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.staging
          build-args: |
            BUILDMODE=production
          push: true
          tags: srkinj/platform-frontend:staging
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  storybook-build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Dockerhub Login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.storybook.staging
          push: true
          tags: srkinj/platform-storybook:staging
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, storybook-build]
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v3

      - name: Download generated OpenAPI
        uses: actions/download-artifact@v4
        with:
          name: backend-openapi
          path: docs

      - name: copy file via ssh key
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_PRIVATE_KEY }}
          source: "docker-compose.staging.yml,docs/openapi.json"
          target: "~/deploy/staging"

      - name: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_PRIVATE_KEY }}
          script: |
            docker pull srkinj/platform-frontend:staging 
            docker pull srkinj/platform-storybook:staging
            docker pull srkinj/platform-backend:staging
            docker compose -f ~/deploy/staging/docker-compose.staging.yml up -d
