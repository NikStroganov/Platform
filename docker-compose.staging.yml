version: "3.8"

services:
  postgres:
    image: postgres:16.0-alpine
    restart: unless-stopped
    container_name: platform_db
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform

  backend:
    image: srkinj/platform-backend:staging
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: platform_db
      DB_PORT: 5432
      DB_NAME: platform_db
      DB_USER: postgres
      DB_PASS: platform
      JWT_PRIVATE_KEY_PATH: file:/keys/private_pkcs8.pem
      JWT_PUBLIC_KEY_PATH: file:/keys/public_pkcs8.pem
      VIRTUAL_PORT: 7070
      VIRTUAL_HOST: backend.careit.tech
      LETSENCRYPT_HOST: backend.careit.tech
      LETSENCRYPT_EMAIL: andrewsorokinch@gmail.com

    volumes:
      - /root/deploy/staging/keys:/keys:ro

    command: ["java", "-jar", "app.jar"]
    networks:
      - platform

  frontend:
    image: srkinj/platform-frontend:staging
    networks:
      - platform
    depends_on:
      - backend
    environment:
      VIRTUAL_HOST: careit.tech
      LETSENCRYPT_HOST: careit.tech
      LETSENCRYPT_EMAIL: andrewsorokinch@gmail.com
      VIRTUAL_PORT: 80

networks:
  platform:
    external: true

volumes:
  postgres_data:

